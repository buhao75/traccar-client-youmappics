name: traccar_client
description: "YouMapPics"
publish_to: 'none'
version: 2.1.7+18

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  traccar_client_sdk: ^1.1.3
  shared_preferences: ^2.5.5
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  firebase_analytics: ^12.6.0
  firebase_crashlytics: ^5.4.0
  quick_actions: ^1.1.1
  rate_my_app: ^2.4.2
  shared_preferences_android: ^2.4.28
  mobile_scanner: ^7.4.2
  app_links: ^7.0.0
  app_settings: ^9.0.0
  share_plus: ^13.3.1
  managed_configurations: ^1.2.0
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.3.0
  webview_flutter_wkwebview: ^3.20.0
  xml: ^6.5.0
  permission_handler: ^11.4.0
  url_launcher: ^6.3.1
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

dependency_overrides:
  jni: ^1.1.0

flutter:
  uses-material-design: true
  generate: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/icon.png"
