name: traccar_client
description: "YouMapPics"
publish_to: 'none'
version: 2.0.0+5

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  traccar_client_sdk: ^1.0.8
  shared_preferences: ^2.5.5
  firebase_core: ^4.9.0
  firebase_messaging: ">=16.2.2 <16.4.2"
  firebase_analytics: ^12.4.1
  firebase_crashlytics: ">=5.2.2 <5.2.5"
  quick_actions: ^1.1.0
  rate_my_app: ^2.4.0
  shared_preferences_android: ^2.4.23
  mobile_scanner: ^7.2.0
  flutter_secure_storage: ^10.2.0
  app_links: ^7.0.0
  app_settings: ^8.0.0
  share_plus: ^13.1.0
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.3.0
  xml: ^6.5.0
  permission_handler: ^11.4.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/icon.png"
